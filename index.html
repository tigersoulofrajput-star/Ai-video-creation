<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRIME AI — Create. Imagine. Generate.</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060f; --bg2:#0d0b1c; --ink:#f3f1ff; --mute:#9a97b8;
  --blue:#2f7bff; --purple:#8a4dff; --pink:#ff4fa3;
  --glass:rgba(255,255,255,.055); --line:rgba(255,255,255,.11);
  --grad:linear-gradient(120deg,var(--blue),var(--purple) 55%,var(--pink));
  --ok:#3ddc97; --bad:#ff5d73;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;line-height:1.5;
  background-image:radial-gradient(700px 420px at 12% -5%,rgba(47,123,255,.22),transparent),radial-gradient(640px 420px at 95% 5%,rgba(255,79,163,.16),transparent),radial-gradient(700px 500px at 60% 110%,rgba(138,77,255,.18),transparent);
  background-attachment:fixed}
h1,h2,h3{font-family:'Sora',system-ui,sans-serif;line-height:1.15}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.pad{padding:22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 20px;font-weight:600;cursor:pointer;background:var(--grad);color:#fff;transition:transform .15s,opacity .15s}
.btn:hover{transform:translateY(-1px)} .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:var(--glass);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.85rem;border-radius:9px}
.btn.danger{background:rgba(255,93,115,.16);border:1px solid rgba(255,93,115,.4);color:#ffb3be}
input,select,textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--purple)}
select option{background:#14112a}
textarea{min-height:120px;resize:vertical}
label{display:block;font-size:.85rem;color:var(--mute);margin:14px 0 6px}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav.top{position:sticky;top:0;z-index:20;background:rgba(7,6,15,.7);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
nav.top .wrap{display:flex;align-items:center;gap:8px;height:62px}
.brand{font-family:'Sora';font-weight:800;font-size:1.2rem;margin-right:auto;display:flex;align-items:center;gap:8px}
.brand img{width:26px;height:26px}
.links{display:flex;gap:4px;align-items:center;flex-wrap:nowrap;overflow-x:auto}
.links a{padding:8px 12px;border-radius:10px;color:var(--mute);font-weight:500;white-space:nowrap}
.links a.on,.links a:hover{color:var(--ink);background:var(--glass)}
.chip{padding:6px 12px;border-radius:99px;background:var(--glass);border:1px solid var(--line);font-weight:600;font-size:.85rem;white-space:nowrap}
main{padding:34px 0 80px}
.hero{padding:70px 0 40px;text-align:left;max-width:760px}
.hero h1{font-size:clamp(2.4rem,7vw,4.4rem);font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--mute);font-size:1.15rem;margin:18px 0 28px;max-width:560px}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tile{display:block;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-3px);border-color:rgba(138,77,255,.6)}
.tile .ic{font-size:1.8rem;margin-bottom:10px}
.tile p{color:var(--mute);font-size:.92rem}
.auth{max-width:420px;margin:50px auto}
.msg{margin-top:14px;padding:10px 14px;border-radius:12px;font-size:.9rem}
.msg.err{background:rgba(255,93,115,.13);color:#ffb3be}.msg.okm{background:rgba(61,220,151,.13);color:#a4f0cf}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;margin:16px 0 22px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--glass);border-radius:99px;padding:7px 16px;cursor:pointer;color:var(--mute)}
.tabs button.on{background:var(--grad);color:#fff;border-color:transparent}
.cd img,.cd video{width:100%;border-radius:12px;display:block;background:#000;max-height:280px;object-fit:cover}
.cd audio{width:100%}
.cd .meta{font-size:.8rem;color:var(--mute);margin:10px 0 4px;display:flex;justify-content:space-between;gap:8px}
.cd .pr{font-size:.92rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:12px}
.st{font-size:.75rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line)}
.st.completed{color:var(--ok)}.st.failed{color:var(--bad)}.st.processing{color:#ffd166}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media(max-width:800px){.two{grid-template-columns:1fr}.links a{padding:8px 9px;font-size:.9rem}}
.out{display:flex;align-items:center;justify-content:center;min-height:300px;color:var(--mute);text-align:center}
.out img,.out video{max-width:100%;border-radius:12px}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--purple);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mute);font-weight:500}
.scroll{overflow-x:auto}
.big{font-family:'Sora';font-size:2.6rem;font-weight:800}
.ads{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ---------- Config (frontend-safe values only) ---------- */
const SUPABASE_URL = 'https://ddseadecdqoykhxgjmix.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Ze5ckg48bz-l7N-aSgid0A_rXRgCdfP';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const DEFAULT_STYLES = ['Realistic','Cinematic','Cartoon','Anime','Ghibli-style','Artistic','3D'];
const DEFAULT_VOICES = ['Voice 1','Voice 2','Voice 3','Voice 4','Voice 5','Voice 6'];
const ADMIN_SECTIONS = ['Dashboard','Users','Add Users','Generations','Credits','Plans','Styles','Voices','Ads','Settings'];

const S = { session:null, credits:null, isAdmin:false, settings:{} };
const $ = (s,r=document)=>r.querySelector(s);
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = d => new Date(d).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
const sleep = ms => new Promise(r=>setTimeout(r,ms));

/* ---------- Data helpers ---------- */
async function loadCredits(){
  if(!S.session){S.credits=null;return}
  const {data,error} = await sb.rpc('get_my_credits');
  if(error){console.warn(error);return}
  const row = Array.isArray(data)?data[0]:data;
  S.credits = (row && typeof row==='object') ? (row.balance ?? 0) : (row ?? 0);
}
async function checkAdmin(){
  S.isAdmin=false;
  if(!S.session)return;
  const {data} = await sb.from('admin_users').select('*').eq('user_id',S.session.user.id).maybeSingle();
  S.isAdmin=!!data; // display only; the server enforces real access via RLS / functions
}
async function callFn(name,body){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) throw new Error('Please log in again.');
  const res = await fetch(`${SUPABASE_URL}/functions/v1/${name}`,{
    method:'POST',
    headers:{'Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_PUBLISHABLE_KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body)
  });
  let json={}; try{json=await res.json()}catch{}
  if(!res.ok) throw new Error(json.error||json.message||`Request failed (${res.status})`);
  return json;
}
const outUrl = j => j.output_url||j.url||j.video_url||j.audio_url||j.image_url||(j.generation&&j.generation.output_url)||null;
async function listStyles(kind){
  const {data,error}=await sb.from('styles').select('name,category,sort_order').eq('is_active',true).order('sort_order');
  const rows=(!error&&data)?data.filter(r=>!r.category||r.category==='both'||r.category===kind):[];
  return rows.length?rows.map(r=>r.name):DEFAULT_STYLES;
}
async function listVoices(){
  const {data,error}=await sb.from('voices').select('name,voice_code,sort_order').eq('is_active',true).order('sort_order');
  return (!error&&data&&data.length)?data:DEFAULT_VOICES.map(n=>({name:n,voice_code:null}));
}
async function adminUsers(){
  const r=await sb.rpc('admin_list_users');
  if(!r.error&&r.data) return r.data;
  const [p,c]=await Promise.all([sb.from('profiles').select('id,full_name,created_at').limit(500),sb.from('credits').select('user_id,balance')]);
  const bal=Object.fromEntries((c.data||[]).map(x=>[x.user_id,x.balance]));
  return (p.data||[]).map(x=>({id:x.id,email:null,full_name:x.full_name,balance:bal[x.id]??0,created_at:x.created_at}));
}

/* ---------- Layout ---------- */
function shell(content,active){
  const authed=!!S.session;
  const links = authed
    ? [['/dashboard','Home'],['/create','Create'],['/creations','My Creations'],['/credits','Credits'],['/profile','Profile']]
        .concat(S.isAdmin?[['/admin','Admin']]:[])
        .map(([h,t])=>`<a href="#${h}" class="${active===h?'on':''}">${t}</a>`).join('')
    : `<a href="#/login">Log in</a><a href="#/signup">Sign up</a>`;
  $('#app').innerHTML=`
  <nav class="top"><div class="wrap">
    <a class="brand" href="#${authed?'/dashboard':'/'}"><img src="logo.svg" alt="" onerror="this.remove()"><span class="grad-text">PRIME AI</span></a>
    <div class="links">${links}</div>
    ${authed?`<span class="chip" title="Credits">◆ ${S.credits??'…'}</span><button class="btn ghost sm" id="logout">Log out</button>`:''}
  </div></nav>
  <main><div class="wrap">${content}</div></main>`;
  const lo=$('#logout'); if(lo) lo.onclick=async()=>{await sb.auth.signOut();location.hash='#/'};
}
const msg=(el,text,ok)=>{el.innerHTML=text?`<div class="msg ${ok?'okm':'err'}">${esc(text)}</div>`:''};

/* ---------- Pages ---------- */
function pageLanding(){
  shell(`
  <section class="hero">
    <h1>Create. Imagine. <span class="grad-text">Generate.</span></h1>
    <p>Turn a sentence into an image, a video clip or a voiceover. One account, one credit balance.</p>
    <div class="row"><a class="btn" href="#/signup">Start creating</a><a class="btn ghost" href="#/login">Log in</a></div>
  </section>
  <section class="grid g3">
    <div class="glass pad tile"><div class="ic">🖼️</div><h3>AI Image</h3><p>Pick a style, describe a scene, download the result.</p></div>
    <div class="glass pad tile"><div class="ic">🎬</div><h3>AI Video</h3><p>Text to video in 5, 10 or 20 seconds.</p></div>
    <div class="glass pad tile"><div class="ic">🎙️</div><h3>AI Voice</h3><p>Paste a script and pick a voice. Get an MP3.</p></div>
  </section>`);
}

function pageAuth(mode){
  const signup=mode==='signup', forgot=mode==='forgot';
  shell(`<div class="glass pad auth">
    <h2>${signup?'Create your account':forgot?'Reset password':'Welcome back'}</h2>
    <form id="f">
      ${signup?`<label>Name</label><input name="name" required autocomplete="name">`:''}
      <label>Email</label><input name="email" type="email" required autocomplete="email">
      ${forgot?'':`<label>Password</label><input name="password" type="password" required minlength="6" autocomplete="${signup?'new-password':'current-password'}">`}
      ${signup?`<label>Confirm password</label><input name="confirm" type="password" required minlength="6" autocomplete="new-password">`:''}
      <div style="margin-top:20px"><button class="btn" style="width:100%" id="go">${signup?'Sign up':forgot?'Send reset link':'Log in'}</button></div>
      <div id="m"></div>
    </form>
    <p style="margin-top:18px;color:var(--mute);font-size:.9rem">
      ${signup?'Have an account? <a href="#/login" class="grad-text">Log in</a>'
        :forgot?'<a href="#/login" class="grad-text">Back to log in</a>'
        :'New here? <a href="#/signup" class="grad-text">Sign up</a> · <a href="#/forgot" class="grad-text">Forgot password?</a>'}
    </p></div>`);
  $('#f').onsubmit=async e=>{
    e.preventDefault();
    const f=Object.fromEntries(new FormData(e.target)), m=$('#m'), b=$('#go');
    b.disabled=true; msg(m,'');
    try{
      if(signup){
        if(f.password!==f.confirm) throw new Error('Passwords do not match.');
        const {data,error}=await sb.auth.signUp({email:f.email,password:f.password,options:{data:{name:f.name,full_name:f.name},emailRedirectTo:location.origin+location.pathname}});
        if(error) throw error;
        if(!data.session){msg(m,'Check your email to confirm your account, then log in.',true);b.disabled=false;return}
      }else if(forgot){
        const {error}=await sb.auth.resetPasswordForEmail(f.email,{redirectTo:location.origin+location.pathname+'#/profile'});
        if(error) throw error; msg(m,'Reset link sent. Check your inbox.',true); b.disabled=false; return;
      }else{
        const {error}=await sb.auth.signInWithPassword({email:f.email,password:f.password});
        if(error) throw error;
      }
    }catch(err){msg(m,err.message);b.disabled=false}
  };
}

async function pageDashboard(){
  shell(`<h2>Dashboard</h2>
  <div class="grid g3" style="margin:20px 0">
    <div class="glass pad"><div style="color:var(--mute)">Credit balance</div><div class="big grad-text">${S.credits??'…'}</div><a class="btn ghost sm" href="#/credits">Get credits</a></div>
    <a class="glass pad tile" href="#/create/image"><div class="ic">🖼️</div><h3>AI Image</h3><p>Quick create</p></a>
    <a class="glass pad tile" href="#/create/video"><div class="ic">🎬</div><h3>AI Video</h3><p>Quick create</p></a>
    <a class="glass pad tile" href="#/create/voice"><div class="ic">🎙️</div><h3>AI Voice</h3><p>Quick create</p></a>
  </div>
  <div class="row" style="justify-content:space-between"><h3>Recent creations</h3><a class="btn ghost sm" href="#/creations">See all</a></div>
  <div id="recent" class="grid g4" style="margin-top:14px"></div><div id="ads"></div>`,'/dashboard');
  const {data}=await sb.from('generations').select('*').order('created_at',{ascending:false}).limit(4);
  $('#recent').innerHTML=(data&&data.length)?data.map(card).join(''):'<p style="color:var(--mute)">Nothing yet. Make your first creation above.</p>';
  bindCards();
  const {data:ads}=await sb.from('ads').select('*').eq('placement','home').order('sort_order');
  const now=Date.now(), http=u=>/^https?:\/\//i.test(u||'');
  const live=(ads||[]).filter(a=>(!a.start_date||new Date(a.start_date)<=now)&&(!a.end_date||new Date(a.end_date)>=now));
  $('#ads').innerHTML=live.length?`<h3 style="margin:30px 0 14px">Sponsored</h3><div class="grid g3">${live.map(a=>`<a class="glass pad tile" href="${http(a.target_url)?esc(a.target_url):'#'}" target="_blank" rel="noopener sponsored">${http(a.image_url)?`<img src="${esc(a.image_url)}" alt="" style="width:100%;border-radius:10px;margin-bottom:10px">`:''}<h3>${esc(a.title)}</h3><p>${esc(a.description||'')}</p>${a.sponsor_name?`<p style="margin-top:6px;font-size:.8rem">${esc(a.sponsor_name)}</p>`:''}</a>`).join('')}</div>`:'';
}

function pageCreate(){
  shell(`<h2>What do you want to make?</h2>
  <div class="grid g3" style="margin-top:20px">
    <a class="glass pad tile" href="#/create/image"><div class="ic">🖼️</div><h3>AI Image</h3><p>Describe a scene in your own words.</p></a>
    <a class="glass pad tile" href="#/create/video"><div class="ic">🎬</div><h3>AI Video</h3><p>Turn a prompt into a short clip.</p></a>
    <a class="glass pad tile" href="#/create/voice"><div class="ic">🎙️</div><h3>AI Voice</h3><p>Read your script aloud.</p></a>
  </div>`,'/create');
}

async function pageGenerator(kind){
  const styles = kind==='voice'?[]:await listStyles(kind);
  const voices = kind==='voice'?await listVoices():[];
  const title={image:'AI Image',video:'AI Video',voice:'AI Voice'}[kind];
  shell(`<div class="row" style="justify-content:space-between"><h2>${title}</h2><span class="chip">◆ <span id="bal">${S.credits??'…'}</span> credits</span></div>
  <div class="two" style="margin-top:20px">
    <form id="f" class="glass pad">
      <label>${kind==='voice'?'Script':'Prompt'}</label>
      <textarea name="prompt" required placeholder="${kind==='voice'?'Paste or type what the voice should say':'Describe what you want to see'}"></textarea>
      ${kind==='image'?`<label>Negative prompt (optional)</label><input name="negative_prompt" placeholder="What to leave out">`:''}
      ${kind!=='voice'?`<label>Style</label><select name="style">${styles.map(s=>`<option>${esc(s)}</option>`).join('')}</select>`:''}
      ${kind==='video'?`<label>Duration</label><select name="duration"><option value="5">5 seconds</option><option value="8" selected>8 seconds</option><option value="10">10 seconds</option><option value="20">20 seconds</option></select>`:''}
      ${kind==='voice'?`<label>Voice</label><select name="voice">${voices.map(s=>`<option value="${esc(s.voice_code||s.name)}">${esc(s.name)}</option>`).join('')}</select>`:''}
      ${kind==='image'?`<label>Reference image (optional)</label><input type="file" name="file" accept="image/*">`:''}
      <div style="margin-top:20px"><button class="btn" id="go" style="width:100%">Generate ${kind}</button></div>
      <div id="m"></div>
    </form>
    <div class="glass pad out" id="out"><span>Your ${kind} will appear here.</span></div>
  </div>`,'/create');

  $('#f').onsubmit=async e=>{
    e.preventDefault();
    const f=new FormData(e.target), b=$('#go'), m=$('#m'), out=$('#out');
    b.disabled=true; msg(m,'');
    out.innerHTML=`<div><div class="spin"></div>${kind==='video'?'Rendering video. This can take a few minutes.':'Generating…'}</div>`;
    try{
      const body={prompt:f.get('prompt')};
      if(kind!=='voice'){body.style=f.get('style'); body.generation_type=kind}
      if(kind==='image'){
        body.negative_prompt=f.get('negative_prompt')||null;
        const file=f.get('file');
        if(file&&file.size){
          const path=`${S.session.user.id}/${Date.now()}-${file.name.replace(/[^\w.-]/g,'_')}`;
          const up=await sb.storage.from('ai-inputs').upload(path,file);
          if(up.error) throw up.error;
          const su=await sb.storage.from('ai-inputs').createSignedUrl(path,3600);
          body.input_image_url=su.data?.signedUrl;
        }
      }
      if(kind==='video'){body.duration_seconds=+f.get('duration'); body.durationSeconds=+f.get('duration')}
      if(kind==='voice'){const sel=$('select[name=voice]'); body.voice_id=f.get('voice'); body.voice=sel.selectedOptions[0].textContent; body.text=f.get('prompt'); body.script=f.get('prompt'); body.generation_type='voice'}
      const fn={image:'Gemini_API_image',video:'Gemini_API_video',voice:'generate-voice'}[kind];
      let res=await callFn(fn,body), url=outUrl(res);
      if(!url && kind==='video'){
        const id=res.generation_id||res.id||(res.generation&&res.generation.id);
        for(let i=0;i<80&&!url;i++){
          await sleep(8000);
          const st=await callFn('Check_Video_Status',{generation_id:id,operation_name:res.operation_name||res.operation});
          if(st.status==='failed') throw new Error(st.error_message||st.error||'Video generation failed.');
          url=outUrl(st);
        }
        if(!url) throw new Error('Video is still processing. Check My Creations in a few minutes.');
      }
      if(!url) throw new Error('Generation finished but no file was returned.');
      out.innerHTML = kind==='image'?`<img src="${esc(url)}" alt="Generated image">`
        :kind==='video'?`<video src="${esc(url)}" controls playsinline></video>`
        :`<div style="width:100%"><audio src="${esc(url)}" controls style="width:100%"></audio></div>`;
      out.innerHTML+=`<div style="width:100%;margin-top:14px"><a class="btn ghost sm" href="${esc(url)}" target="_blank" rel="noopener" download>Download</a> <a class="btn ghost sm" href="#/creations">My creations</a></div>`;
      out.style.flexDirection='column';
      await loadCredits(); $('#bal').textContent=S.credits;
    }catch(err){
      out.innerHTML='<span>Nothing was generated.</span>'; msg(m,err.message);
      await loadCredits(); const bal=$('#bal'); if(bal) bal.textContent=S.credits;
    }
    b.disabled=false;
  };
}

/* ---------- My Creations ---------- */
function card(g){
  const u=g.output_url;
  const prev = !u?`<div class="out" style="min-height:140px">${esc(g.status)}</div>`
    : g.generation_type==='image'?`<img src="${esc(u)}" loading="lazy" alt="">`
    : g.generation_type==='video'?`<video src="${esc(u)}" controls preload="metadata" playsinline></video>`
    : `<audio src="${esc(u)}" controls></audio>`;
  return `<div class="glass pad cd" data-id="${esc(g.id)}">${prev}
    <div class="meta"><span>${esc(g.generation_type)} · ${fmtDate(g.created_at)}</span><span class="st ${esc(g.status)}">${esc(g.status)}</span></div>
    <div class="pr">${esc(g.prompt)}</div>
    ${g.error_message?`<div style="color:var(--bad);font-size:.8rem;margin-bottom:8px">${esc(g.error_message)}</div>`:''}
    <div class="row">
      ${u?`<a class="btn ghost sm" href="${esc(u)}" download target="_blank" rel="noopener">Download</a>`:''}
      <button class="btn ghost sm" data-fav="${esc(g.id)}">☆ Favorite</button>
      <button class="btn danger sm" data-del="${esc(g.id)}">Delete</button>
    </div></div>`;
}
let favSet=new Set();
function bindCards(){
  document.querySelectorAll('[data-fav]').forEach(b=>{
    const id=b.dataset.fav; if(favSet.has(id)) b.textContent='★ Favorited';
    b.onclick=async()=>{
      if(favSet.has(id)){
        await sb.from('favorites').delete().eq('generation_id',id).eq('user_id',S.session.user.id);
        favSet.delete(id); b.textContent='☆ Favorite';
      }else{
        const {error}=await sb.from('favorites').insert({user_id:S.session.user.id,generation_id:id});
        if(!error){favSet.add(id); b.textContent='★ Favorited'} else alert(error.message);
      }
    };
  });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Delete this creation?')) return;
    const {error}=await sb.from('generations').delete().eq('id',b.dataset.del);
    if(error) return alert(error.message);
    b.closest('.cd').remove();
  });
}
async function pageCreations(){
  let tab='all';
  shell(`<h2>My Creations</h2>
  <div class="tabs" id="tabs">${[['all','All'],['image','Images'],['video','Videos'],['voice','Voices']].map(([k,t])=>`<button data-t="${k}" class="${k==='all'?'on':''}">${t}</button>`).join('')}</div>
  <div id="list" class="grid g4"></div>`,'/creations');
  const {data:favs}=await sb.from('favorites').select('generation_id');
  favSet=new Set((favs||[]).map(f=>String(f.generation_id)));
  const load=async()=>{
    $('#list').innerHTML='<p style="color:var(--mute)">Loading…</p>';
    let q=sb.from('generations').select('*').order('created_at',{ascending:false}).limit(100);
    if(tab!=='all') q=q.eq('generation_type',tab);
    const {data,error}=await q;
    $('#list').innerHTML=error?`<p class="msg err">${esc(error.message)}</p>`:(data.length?data.map(card).join(''):'<p style="color:var(--mute)">No creations here yet.</p>');
    bindCards();
  };
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
    tab=b.dataset.t; document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b)); load();
  });
  load();
}

/* ---------- Credits / Profile ---------- */
async function pageCredits(){
  shell(`<h2>Credits</h2>
  <div class="glass pad" style="margin:20px 0;max-width:340px"><div style="color:var(--mute)">Current balance</div><div class="big grad-text">${S.credits??'…'}</div></div>
  <h3>Plans</h3><div id="plans" class="grid g3" style="margin:14px 0 30px"></div>
  <h3>History</h3><div class="glass pad scroll" style="margin-top:14px" id="tx">Loading…</div>`,'/credits');
  const [{data:plans},{data:tx}]=await Promise.all([
    sb.from('plans').select('*').order('price',{ascending:true}),
    sb.from('credit_transactions').select('*').order('created_at',{ascending:false}).limit(30)
  ]);
  const act=(plans||[]).filter(p=>p.is_active!==false);
  $('#plans').innerHTML=act.length?act.map(p=>`<div class="glass pad"><h3>${esc(p.name||p.title||'Plan')}</h3>
    <div class="big">${p.price!=null?'₹'+Number(p.price).toLocaleString('en-IN'):''}</div>
    <p style="color:var(--mute)">${esc(p.credits??'')} credits${p.duration_days?` · ${esc(p.duration_days)} days`:''}</p>
    <button class="btn ghost sm" style="margin-top:12px" disabled>Payments coming soon</button></div>`).join(''):'<p style="color:var(--mute)">No plans available yet.</p>';
  $('#tx').innerHTML=(tx&&tx.length)?`<table><tr><th>Date</th><th>Amount</th><th>Description</th></tr>${tx.map(t=>`<tr><td>${fmtDate(t.created_at)}</td><td>${t.amount>0?'+':''}${esc(t.amount)}</td><td>${esc(t.description||t.transaction_type||'')}</td></tr>`).join('')}</table>`:'No transactions yet.';
}
async function pageProfile(){
  const u=S.session.user;
  const {data:p}=await sb.from('profiles').select('*').eq('id',u.id).maybeSingle();
  shell(`<h2>Profile</h2><div class="glass pad" style="max-width:480px;margin-top:20px">
    <form id="f"><label>Name</label><input name="name" value="${esc(p?.full_name||u.user_metadata?.full_name||u.user_metadata?.name||'')}">
    <label>Email</label><input value="${esc(u.email)}" disabled>
    <div style="margin-top:18px"><button class="btn">Save changes</button></div><div id="m"></div></form>
    <hr style="border:0;border-top:1px solid var(--line);margin:24px 0">
    <form id="pw"><label>New password</label><input name="password" type="password" minlength="6" required autocomplete="new-password">
    <div style="margin-top:18px"><button class="btn ghost">Change password</button></div><div id="m2"></div></form></div>`,'/profile');
  $('#f').onsubmit=async e=>{
    e.preventDefault();
    const name=new FormData(e.target).get('name');
    const {error}=await sb.from('profiles').update({full_name:name,updated_at:new Date().toISOString()}).eq('id',u.id);
    if(!error) await sb.auth.updateUser({data:{name,full_name:name}});
    msg($('#m'),error?error.message:'Saved.',!error);
  };
  $('#pw').onsubmit=async e=>{
    e.preventDefault();
    const {error}=await sb.auth.updateUser({password:new FormData(e.target).get('password')});
    msg($('#m2'),error?error.message:'Password changed.',!error); if(!error) e.target.reset();
  };
}

/* ---------- Admin ---------- */
const ADMIN_TABLES={Users:'profiles',Generations:'generations',Plans:'plans',Styles:'styles',Voices:'voices',Ads:'ads',Settings:'site_settings'};
async function pageAdmin(section='Dashboard'){
  if(!S.isAdmin){shell('<div class="glass pad auth"><h3>Admin access required</h3><p style="color:var(--mute)">This account is not an admin.</p></div>');return}
  shell(`<h2>Admin</h2><div class="tabs" id="tabs">${ADMIN_SECTIONS.map(s=>`<button data-s="${s}" class="${s===section?'on':''}">${s}</button>`).join('')}</div><div id="ad"></div>`,'/admin');
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>pageAdmin(b.dataset.s));
  const box=$('#ad');
  try{
    if(section==='Dashboard'){
      const c=async t=>(await sb.from(t).select('*',{count:'exact',head:true})).count??'–';
      const [u,g,p]=await Promise.all([c('profiles'),c('generations'),c('plans')]);
      box.innerHTML=`<div class="grid g3">${[['Users',u],['Generations',g],['Plans',p]].map(([k,v])=>`<div class="glass pad"><div style="color:var(--mute)">${k}</div><div class="big grad-text">${v}</div></div>`).join('')}</div>`;
    }else if(section==='Add Users'){
      box.innerHTML=`<div class="glass pad" style="max-width:460px"><p style="color:var(--mute);font-size:.9rem">Creating a user needs the service-role key, so it must run in a server-side function. Until an admin Edge Function exists, ask people to sign up themselves, then add credits under Credits.</p></div>`;
    }else if(section==='Credits'){
      const u=await adminUsers();
      box.innerHTML=`<div class="glass pad" style="max-width:460px"><form id="cf">
        <label>User</label><select name="uid">${(u||[]).map(x=>`<option value="${esc(x.id)}">${esc(x.email||x.full_name||x.id)} (${esc(x.balance)})</option>`).join('')}</select>
        <label>Amount</label><input name="amt" type="number" min="1" required>
        <div class="row" style="margin-top:18px"><button class="btn" value="add">Add credits</button><button class="btn danger" value="remove" type="button" id="rm">Remove credits</button></div><div id="m"></div></form></div>`;
      const run=async fn=>{
        const f=Object.fromEntries(new FormData($('#cf')));
        const {error}=await sb.rpc(fn,{p_user_id:f.uid,p_amount:+f.amt,p_description:'Admin adjustment'});
        msg($('#m'),error?error.message:'Done.',!error);
      };
      $('#cf').onsubmit=e=>{e.preventDefault();run('admin_add_credits')};
      $('#rm').onclick=()=>run('admin_remove_credits');
    }else if(section==='Users'){
      const u=await adminUsers();
      box.innerHTML=`<div class="glass pad scroll"><table><tr><th>Name</th><th>Email</th><th>Credits</th><th>Joined</th><th>User ID</th></tr>${u.map(x=>`<tr><td>${esc(x.full_name||'')}</td><td>${esc(x.email||'')}</td><td>${esc(x.balance)}</td><td>${x.created_at?fmtDate(x.created_at):''}</td><td style="font-size:.75rem">${esc(x.id)}</td></tr>`).join('')}</table></div>`;
    }else{
      const table=ADMIN_TABLES[section];
      await adminTable(box,table,section!=='Users'&&section!=='Generations');
    }
  }catch(err){box.innerHTML=`<p class="msg err">${esc(err.message)}</p>`}
}
async function adminTable(box,table,editable){
  const {data,error}=await sb.from(table).select('*').order('created_at',{ascending:false,nullsFirst:false}).limit(200);
  if(error) throw error;
  const cols=data.length?Object.keys(data[0]).slice(0,9):[];
  box.innerHTML=`<div class="glass pad scroll">${data.length?`<table><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}${editable?'<th></th>':''}</tr>
    ${data.map(r=>`<tr>${cols.map(c=>`<td>${esc(typeof r[c]==='object'?JSON.stringify(r[c]):String(r[c]??'').slice(0,80))}</td>`).join('')}${editable?`<td><button class="btn danger sm" data-id="${esc(r.id)}">Delete</button></td>`:''}</tr>`).join('')}</table>`:'<p style="color:var(--mute)">No rows.</p>'}</div>
    ${editable?`<div class="glass pad" style="margin-top:16px"><h3>Add row</h3><label>Row as JSON (column names from your ${esc(table)} table)</label><textarea id="js" placeholder='{"name":"Example"}'></textarea>
    <div style="margin-top:14px"><button class="btn" id="add">Add</button></div><div id="m"></div></div>`:''}`;
  box.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Delete this row?')) return;
    const {error}=await sb.from(table).delete().eq('id',b.dataset.id);
    if(error) return alert(error.message); adminTable(box,table,editable);
  });
  const add=$('#add',box);
  if(add) add.onclick=async()=>{
    try{
      const row=JSON.parse($('#js').value);
      const {error}=await sb.from(table).insert(row); if(error) throw error;
      adminTable(box,table,editable);
    }catch(e){msg($('#m'),e.message)}
  };
}

/* ---------- Router ---------- */
async function route(){
  const path=(location.hash.replace(/^#/,'')||'/').split('?')[0];
  const authed=!!S.session;
  const pub=['/','/login','/signup','/forgot'];
  if(!authed && !pub.includes(path)){location.hash='#/login';return}
  if(authed && ['/login','/signup','/forgot'].includes(path)){location.hash='#/dashboard';return}
  window.scrollTo(0,0);
  if(authed) await loadCredits();
  if(path==='/') return pageLanding();
  if(path==='/login') return pageAuth('login');
  if(path==='/signup') return pageAuth('signup');
  if(path==='/forgot') return pageAuth('forgot');
  if(path==='/dashboard') return pageDashboard();
  if(path==='/create') return pageCreate();
  if(path==='/create/image') return pageGenerator('image');
  if(path==='/create/video') return pageGenerator('video');
  if(path==='/create/voice') return pageGenerator('voice');
  if(path==='/creations') return pageCreations();
  if(path==='/credits') return pageCredits();
  if(path==='/profile') return pageProfile();
  if(path==='/admin') return pageAdmin();
  location.hash='#/';
}
window.addEventListener('hashchange',route);
sb.auth.onAuthStateChange(async (ev,session)=>{
  const was=!!S.session; S.session=session;
  await checkAdmin();
  if(ev==='SIGNED_IN'&&!was&&location.hash.match(/login|signup|forgot|^$|^#\/?$/)) location.hash='#/dashboard';
  if(ev==='SIGNED_OUT') location.hash='#/';
});
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  S.session=session; await checkAdmin(); route();
})();
</script>
